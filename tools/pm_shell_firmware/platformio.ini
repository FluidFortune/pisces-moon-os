;
; ============================================================
;  platformio.ini — Independent firmware build configuration
;
;  This firmware is independent of Pisces Moon OS. It targets the
;  same 5 device classes but with a much smaller surface: a Lua
;  REPL over USB-CDC, no launcher, no display rendering, no apps.
;
;  Targets:
;    tdeck_plus      LilyGO T-Deck Plus (ESP32-S3)
;    tlorapager      LilyGO T-LoRa Pager (ESP32-S3)
;    cardputer_adv   M5Stack Cardputer ADV (ESP32-S3, no PSRAM)
;    c28p            LCDwiki C28P 2.8" ESP32-S3 Display
;    maxine          Sunton ESP32-8048S050C 5" 800x480
;
;  Usage:
;    pio run -e tdeck_plus
;    pio run -e tlorapager --target upload
;    pio device monitor -e cardputer_adv
;
;  Prerequisites:
;    ./fetch_lua.sh   must be run once before first build
; ============================================================

[platformio]
default_envs = tdeck_plus

; ── Shared common block ────────────────────────────────
; Matches the Pisces Moon platform pin so device behavior is
; predictable. Kept deliberately minimal — no Arduino-GFX, no
; SdFat, no NimBLE, no ESP32-audioI2S. The shell ships only
; what bindings actually need.
[common]
platform  = espressif32 @ 6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

upload_speed = 921600

board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

; lib_deps is intentionally empty in [common]. Each env adds
; what it actually uses. Most envs use only Arduino + WiFi +
; Wire + SD/SD_MMC — all built into the core, no lib_deps.
lib_deps =

build_flags_common =
    -I include
    -I lib/lua
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Os
    -DPM_SHELL_VERSION=\"0.1.0\"
    ; Lua build configuration:
    -DLUA_USE_C89                  ; portable build, no POSIX-isms
    -DLUA_32BITS                   ; 32-bit integers/floats on a 32-bit MCU
    ; LUA_FLOAT_TYPE=2 selects single-precision (LUAI_NUMTYPE_FLOAT).
    ; The ESP32-S3 FPU is single-precision; double is software-emulated.
    -DLUA_FLOAT_TYPE=2

build_flags_psram =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -mfix-esp32-psram-cache-issue


; ════════════════════════════════════════════════════════
;  T-DECK PLUS
; ════════════════════════════════════════════════════════
;
; SD card on SPI bus. Pinout matches Pisces Moon's verified config.
; Lua VM lives in PSRAM. Plenty of headroom for deeply-nested scripts.
[env:tdeck_plus]
extends = common

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

board_build.arduino.memory_type = qio_opi

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram}
    -DDEVICE_TDECK_PLUS
    -DPM_SHELL_TARGET=\"tdeck_plus\"
    ; ─── I2C bus (Wire) ───
    -DPIN_I2C_SDA=18
    -DPIN_I2C_SCL=8
    ; ─── SD card (SPI) ───
    -DPIN_SD_MOSI=41
    -DPIN_SD_MISO=38
    -DPIN_SD_SCK=40
    -DPIN_SD_CS=39
    -DPM_SD_BACKEND_SPI=1


; ════════════════════════════════════════════════════════
;  T-LORA PAGER
; ════════════════════════════════════════════════════════
[env:tlorapager]
extends = common

platform = espressif32 @ 6.10.0

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

board_build.arduino.memory_type = qio_qspi

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram}
    -DDEVICE_TLORAPAGER
    -DPM_SHELL_TARGET=\"tlorapager\"
    ; ─── I2C bus ───
    -DPIN_I2C_SDA=3
    -DPIN_I2C_SCL=2
    ; ─── SD card (SPI — shared bus, but no other peripherals
    ;     touched in this firmware so it's effectively exclusive) ───
    -DPIN_SD_MOSI=34
    -DPIN_SD_MISO=33
    -DPIN_SD_SCK=35
    -DPIN_SD_CS=21
    -DPM_SD_BACKEND_SPI=1


; ════════════════════════════════════════════════════════
;  CARDPUTER ADV — no PSRAM
; ════════════════════════════════════════════════════════
;
; 8MB flash, no PSRAM. Lua VM lives in internal DRAM (~50 KB
; budget after FreeRTOS + WiFi). Scripts that allocate large
; tables can hit "not enough memory". Documented in README.
[env:cardputer_adv]
extends = common

board_upload.flash_size   = 8MB
board_upload.maximum_size = 8388608
board_build.partitions    = partitions_cardputer.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

build_flags =
    ${common.build_flags_common}
    ; NO build_flags_psram — this board has none
    -DDEVICE_CARDPUTER_ADV
    -DDEVICE_NO_PSRAM
    -DPM_SHELL_TARGET=\"cardputer_adv\"
    ; ─── I2C bus ───
    -DPIN_I2C_SDA=8
    -DPIN_I2C_SCL=9
    ; ─── SD card (SPI) ───
    -DPIN_SD_MOSI=14
    -DPIN_SD_MISO=39
    -DPIN_SD_SCK=40
    -DPIN_SD_CS=12
    -DPM_SD_BACKEND_SPI=1


; ════════════════════════════════════════════════════════
;  C28P (LCDwiki 2.8" Display Kiosk)
; ════════════════════════════════════════════════════════
;
; SD card on SDIO 4-bit (not SPI). Uses Arduino's SD_MMC library.
[env:c28p]
extends = common

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

board_build.arduino.memory_type = qio_opi

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram}
    -DDEVICE_C28P
    -DPM_SHELL_TARGET=\"c28p\"
    ; ─── I2C bus (touch + audio codec live here, but unused
    ;     in this firmware unless the user pokes them via
    ;     pm.i2c.* from Lua) ───
    -DPIN_I2C_SDA=16
    -DPIN_I2C_SCL=15
    ; ─── MicroSD on SDIO 4-bit ───
    -DPIN_SD_CLK=38
    -DPIN_SD_CMD=40
    -DPIN_SD_D0=39
    -DPIN_SD_D1=41
    -DPIN_SD_D2=48
    -DPIN_SD_D3=47
    -DPM_SD_BACKEND_SDMMC=1


; ════════════════════════════════════════════════════════
;  MAXINE (Sunton 8048S050C 5" 800x480)
; ════════════════════════════════════════════════════════
;
; Same SoC class as C28P but SD lives on SPI here.
; RGB display is not initialized.
[env:maxine]
extends = common

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

board_build.arduino.memory_type = qio_opi

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram}
    -DDEVICE_MAXINE
    -DPM_SHELL_TARGET=\"maxine\"
    ; ─── I2C bus (GT911 touch lives here, unused in Phase 1) ───
    -DPIN_I2C_SDA=19
    -DPIN_I2C_SCL=20
    ; ─── SD card (SPI) ───
    -DPIN_SD_MOSI=11
    -DPIN_SD_MISO=13
    -DPIN_SD_SCK=12
    -DPIN_SD_CS=10
    -DPM_SD_BACKEND_SPI=1
