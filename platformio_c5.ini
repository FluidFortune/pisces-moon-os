; ═════════════════════════════════════════════════════════════════
;  Pisces Moon OS — ESP32-C5 build (PARKED, pioarduino)
;
;  This environment was moved out of platformio.ini on 2026-11-10.
;
;  Why: the C5 needs the pioarduino platform fork. Whenever PlatformIO
;  loaded this env's platform, pioarduino's installer replaced the
;  official PlatformIO Core in ~/.platformio/penv with its own
;  "pioarduino_core" and overwrote shared packages
;  (framework-arduinoespressif32, tool-esptoolpy). That broke the VS
;  Code PlatformIO extension and the espressif32 @ 6.7.0 builds for
;  every other device.
;
;  PlatformIO only reads a file named platformio.ini, so nothing here
;  is loaded or installed by the main project.
;
;  To build the C5 without touching ~/.platformio, give it its own
;  PlatformIO home in a separate project folder, e.g. ../pisces-c5/:
;
;    [platformio]
;    core_dir    = ~/.platformio-pioarduino   ; pioarduino lives here only
;    src_dir     = ../pisces-moon-os/src
;    include_dir = ../pisces-moon-os/include
;    data_dir    = ../pisces-moon-os/data
;    default_envs = c5
;
;  then paste the [env:c5] section below under it (adjust relative
;  paths such as partition tables and variants).
; ═════════════════════════════════════════════════════════════════

; ── C5 (NM-CYD-C5 "Colorful" — RockBase, ESP32-C5) ───────
; Source: github.com/RockBase-iot/NM-CYD-C5 (pinout + platform)
;
; Form factor:  CYD-style 2.8" desk kiosk, ESP32-C5-WROOM-1
; Display:      2.8" 240×320 ST7789 (also ILI9341-compatible)
; Touch:        XPT2046 RESISTIVE (SPI — NOT FT6336G capacitive)
; Storage:      microSD via SPI (shared with LCD + touch)
; Memory:       ESP32-C5-WROOM-1 MCN16R8 — 16 MB flash, 8 MB PSRAM
; Radios:       Wi-Fi 6 DUAL-BAND (2.4 + 5 GHz), BLE 5.3, 802.15.4
; Input:        Touchscreen only (resistive) — no keyboard
; Power:        USB-C (×2: one is CH340 UART bridge, one is native USB)
; Unique:       The only Pisces Moon device that can see 5 GHz APs.
;
; ⚠ PLATFORM IS NOT STANDARD ESPRESSIF32.
;   ESP32-C5 chip support requires the pioarduino fork. RockBase's
;   reference firmware ships with platform = pioarduino release
;   55.03.36 (which provides Arduino-ESP32 core 3.3.6 and ESP-IDF
;   5.5.x). Standard espressif32@6.x does NOT include the C5.
;
; ⚠ SHARED SPI BUS — TREATY MANDATORY.
;   LCD, XPT2046 touch, and SD all share GPIO 6/2/7. Every consumer
;   takes the SPI mutex (spi_treaty.h) before touching the bus.
;
; ⚠ SINGLE-CORE — Ghost Engine must time-slice.
;   c5_wardrive_engine.cpp uses async WiFi scan + vTaskDelay yields
;   so the UI keeps running. Do NOT raise task priority above 1.
;
; ⚠ LCD DC/BL pins verified (DC=24, BL=25, RST=tied to chip reset).
;   Source: RockBase NM-CYD-C5 README + Bruce ESP32-C5-tft connections.md.
;   First-boot symptom of getting these wrong: SPI bus + touch work
;   normally but the screen stays blank — because invalid commands
;   hit a dead DC line and a wrong BL pin keeps the backlight off.
[env:c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino

; C5 lib_deps is CURATED — we do NOT inherit ${common.lib_deps} because
; the C5 needs a different NimBLE version than the other boards. The
; common 1.4.1 NimBLE-Arduino was written against ESP-IDF 4.x / older
; arduino-esp32 and won't compile against the C5's IDF 5.5 NimBLE host.
; The 2.x branch is the rewrite that explicitly supports C3/C5/C6/H2
; per h2zero's README. Other boards keep 1.4.1 for ABI stability.
;
; Libraries omitted vs. the common set:
;   TAMC_GT911       — C5 uses XPT2046 resistive driven inline in c5_boot.cpp
;   ESP32-audioI2S   — C5 has no audio hardware in this build
;   RadioLib         — C5 has no LoRa
lib_deps =
    lewisxhe/XPowersLib @ 0.2.1
    greiman/SdFat @ 2.2.3
    mikalhart/TinyGPSPlus @ 1.0.3
    bblanchon/ArduinoJson @ 7.4.3
    h2zero/NimBLE-Arduino @ ^2.1.0
    https://github.com/tzapu/WiFiManager.git
    ; GFX Library: C5 needs 1.6.5 specifically. The chain of fixes:
    ;   1.4.7 (other boards)  — references soc/dport_reg.h, Xtensa-only
    ;   1.6.2                 — adds ESP32-C5 board name
    ;   1.6.3                 — adds C5 default databus pin defs
    ;   1.6.5                 — "Fix build error with ESP32 Arduino core 3.3.6"
    ;                           (the spiFrequencyToClockDiv() signature change
    ;                           in arduino-esp32 3.3.6 — added spi_t* first param)
    moononournation/GFX Library for Arduino @ 1.6.5

upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

; ESP32-C5 has Quad-SPI PSRAM (not Octal like S3 variants).
board_build.arduino.memory_type = qio_qspi

; ─── BUILD SOURCE FILTER — C5 first-boot bring-up ───
; Minimal set: universal core + C5 bring-up + games that compile
; without keyboard/trackball deps. The wardrive engine is the C5
; equivalent of c28p_wardrive_engine.cpp — async scan, 5 GHz band
; alternation, PMU1 fan-out to a paired P4.
build_src_filter =
    -<*>
    +<main.cpp>
    +<c5_boot.cpp>
    +<c5_wardrive_engine.cpp>
    +<c28p_anomaly.cpp>          ; shared anomaly detector (device-agnostic)
    +<tetris.cpp>
    +<snake.cpp>
    +<pacman.cpp>
    +<galaga.cpp>
    +<pole_position.cpp>
    +<mario_bros.cpp>
    +<donkey_kong.cpp>
    +<breakout.cpp>
    +<game_2048.cpp>
    +<minesweeper.cpp>
    +<connect4.cpp>
    +<simon.cpp>
    +<solitaire.cpp>
    +<asteroids.cpp>
    +<space_invaders.cpp>
    +<frogger.cpp>
    +<chess.cpp>
    +<ereader.cpp>
    +<c5_dpad.cpp>               ; touch-only virtual gamepad (XPT2046, single-finger)
    +<kiosk_wifi_setup.cpp>      ; touch-keyboard WiFi join (shared with C28P + Maxine)
    +<weather.cpp>               ; Open-Meteo — portrait branch shared with C28P
    +<rss.cpp>                   ; RSS reader — portrait branch shared with C28P (v1.2.1 parity)
    +<game_input.cpp>
    +<game_audio.cpp>
    +<nosql_store.cpp>
    +<pm_storage.cpp>
    +<database.cpp>
    +<wifi_manager.cpp>
    +<wifi_mode.cpp>
    +<wifi_filemgr.cpp>
    +<pm_text_input.cpp>
    +<pm_calculator.cpp>
    +<pm_units.cpp>
    +<pm_clock.cpp>
    +<pm_tracker_scan.cpp>
    +<pm_rss_cache.cpp>
    +<pm_notes.cpp>
    +<pm_contacts.cpp>
    +<pm_calendar.cpp>
    +<gemini_client.cpp>
    +<text_buffer.cpp>
    ; ─── DEFERRED for C5 first-pass ────────────────────────
    ; These files were in the initial C5 scaffold but are not yet
    ; touch-only-aware:
    ;   data_reader.cpp / filesystem.cpp — both call get_touch() /
    ;     get_keypress() / update_trackball() unconditionally, which
    ;     the C5's pure-touch input model doesn't provide. The C28P
    ;     solves this with a separate c28p_data_reader.cpp. A future
    ;     c5_data_reader.cpp will mirror that pattern; until then
    ;     the REFERENCE menu in c5_boot.cpp points SURVIVAL/MEDICAL/
    ;     HISTORY tiles at c5_coming_soon().
    ;   time_service.cpp — file does not currently exist on disk.
    ;     Left in C28P's filter too; pio silently ignores it.
    ;
    ; ereader.cpp IS now included (above) — it has touch branches
    ; for both C28P (FT6336G) and C5 (XPT2046), wired through
    ; run_ereader() in c5_open_reference. The E-READER tile is
    ; the first REFERENCE app live on the C5.
    ; +<time_service.cpp>
    ; +<data_reader.cpp>
    ; +<filesystem.cpp>

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram_riscv}
    ; ─── Disable PIC on RISC-V ───
    ; common.build_flags_common sets -fPIC for the S3 ELF-loader system.
    ; On Xtensa that's effectively a no-op for .got.plt (windowed calls
    ; sidestep PLT). On RISC-V GCC 14.2 it generates real GOT/PLT
    ; relocations that the IDF linker script discards, breaking the
    ; final link with: "discarded output section: `.got.plt`".
    ; The Rust target for riscv32-esp-espidf also pins RelocModel::Static,
    ; same reason. The C5 build doesn't include the ELF loader anyway,
    ; so we just override here. -fno-pic / -fno-PIC must both appear
    ; (GCC pairs them) and must come AFTER ${common.build_flags_common}.
    -fno-pic
    -fno-PIC
    -DDEVICE_C5
    -DARDUINO_NM_CYD_C5
    ; ─── Shared SPI bus (LCD + XPT2046 + SD) ───
    ; CONFIRMED from RockBase README pinout table.
    -DPIN_SPI_SCK=6
    -DPIN_SPI_MISO=2
    -DPIN_SPI_MOSI=7
    ; ─── LCD (ST7789, 240×320 portrait via rotation) ───
    ; CS=23 confirmed; DC/RST/BL are CYD-family guesses, verify.
    -DPIN_LCD_MOSI=7
    -DPIN_LCD_MISO=2
    -DPIN_LCD_SCK=6
    -DPIN_LCD_CS=23
    -DPIN_LCD_DC=24      ; verified — RockBase ref + Bruce ESP32-C5-tft connections.md
    -DPIN_LCD_RST=-1     ; verified — wired to ESP32-C5 chip reset, no dedicated GPIO
    -DPIN_LCD_BL=25      ; verified — RockBase ref + Bruce ESP32-C5-tft connections.md
    ; ── OTHER PINS PULLED FROM Bruce ESP32-C5-tft connections.md ─────────────
    ;   IR_RX=26   IR_TX=3      LED=27 (RGB status LED, NOT backlight —
    ;                                  our old PIN_LCD_BL=27 was hitting this)
    ;   Buttons:   Prev=0  Sel=28  Next=1
    ;   Alt UART:  Tx=11   Rx=12  (in addition to LP-UART P5 GPS=4/5)
    ; Not used in this build, but recorded for future wardrive / sensor wiring.
    ; ─── XPT2046 resistive touch (NOT FT6336G capacitive!) ───
    ; CS=1 confirmed; IRQ pin not exposed in README, poll-mode used.
    -DPIN_TOUCH_CS=1
    -DPIN_TOUCH_IRQ=-1
    ; ─── MicroSD (SPI, shared bus) ───
    -DPIN_SD_CS=10
    -DPIN_SD_MOSI=7
    -DPIN_SD_MISO=2
    -DPIN_SD_SCK=6
    ; ─── LP-UART (P5 connector — GPS-ready or PMU1 to P4) ───
    -DPIN_GPS_RX=4
    -DPIN_GPS_TX=5
    ; PMU1 defaults to the LP-UART pins. If you want a real GPS
    ; instead of the P4 peer link, undefine and reroute via FPC2.
    -DPIN_PMU1_TX=5
    -DPIN_PMU1_RX=4
    ; ─── I2C (CN1 extend connector) ───
    -DPIN_I2C_SDA=9
    -DPIN_I2C_SCL=8
    ; ─── Misc ───
    ; Note: arduino-esp32's c5 variant pins_arduino.h already defines
    ; PIN_RGB_LED=27. We don't override here — verify against demo
    ; source at first bring-up and add an override only if needed.
    -DPIN_BOOT_BTN=9
    ; ─── Capability flags ───
    -DPM_FORM_FACTOR_KIOSK
    -DPM_HAS_TOUCH
    -DPM_HAS_WIFI_5GHZ   ; fleet-unique — the whole reason for this port
    -DPM_NO_GPS          ; GPS sourced elsewhere (P4 over PMU1, etc.)
    -DPM_NO_KEYBOARD
    -DPM_NO_LORA
    -DPM_NO_AUDIO_IN
    -DPM_NO_AUDIO_OUT
