    ;   data_reader.cpp / filesystem.cpp — both call get_touch() /
    ;     get_keypress() / update_trackball() unconditionally, which
    ;     the C5's pure-touch input model doesn't provide. The C28P
    ;     solves this with a separate c28p_data_reader.cpp. A future
    ;     c5_data_reader.cpp will mirror that pattern; until then
    ;     the REFERENCE menu in c5_boot.cpp points SURVIVAL/MEDICAL/
    ;     HISTORY tiles at c5_coming_soon().
    ;   time_service.cpp — file does not currently exist on disk.
    ;     Left in C28P's filter too; pio silently ignores it.
    ;
    ; ereader.cpp IS now included (above) — it has touch branches
    ; for both C28P (FT6336G) and C5 (XPT2046), wired through
    ; run_ereader() in c5_open_reference. The E-READER tile is
    ; the first REFERENCE app live on the C5.
    ; +<time_service.cpp>
    ; +<data_reader.cpp>
