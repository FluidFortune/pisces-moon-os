;
; ============================================================
;  platformio.ini — Multi-device build configuration
;
;  Targets:
;    tdeck_plus      LilyGO T-Deck Plus (ESP32-S3) — flagship
;    tlorapager      LilyGO T-LoraPager (ESP32-S3) — mesh-focused
;    cardputer_adv   M5Stack Cardputer ADV (ESP32-S3) — pocket
;    c28p            LCDwiki 2.8" ESP32-S3 Display C28P — entry-level kiosk
;
;  Usage:
;    VS Code: select environment in PlatformIO toolbar (bottom)
;    CLI:     pio run -e tdeck_plus --target upload
;             pio run -e tlorapager --target upload
;             pio run -e cardputer_adv --target upload
;             pio run -e c28p --target upload
;
;  Device class envelope:
;    Pisces Moon targets ESP32-S3 family chipsets with color
;    displays, WiFi + BLE, and at least 320KB SRAM. The OS adapts
;    to whatever additional capabilities a device provides —
;    keyboards, trackballs, LoRa, GPS, audio I/O, touch — and
;    modules itself accordingly. Devices outside this envelope
;    (different chipset families, monochrome displays, sub-floor
;    memory) are out of scope.
;
;  Version roadmap:
;    v1.2.0  — Multi-Device (T-Deck Plus, T-LoRa Pager, Cardputer ADV) — SHIPPED
;    v1.2.1  — Multi-Device continuation: Ghost Partition fixes, DUCKY
;              cleanup, C28P entry-level target, capability descriptor
; ============================================================

[platformio]
default_envs = tdeck_plus

; ── Shared settings — common to all S3 devices ───────────
[common]
platform  = espressif32 @ 6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

upload_speed  = 921600

board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

; Shared lib_deps — all devices use these
lib_deps =
    lewisxhe/XPowersLib @ 0.2.1
    tamctec/TAMC_GT911 @ 1.0.2
    greiman/SdFat @ 2.2.3
    mikalhart/TinyGPSPlus @ 1.0.3
    bblanchon/ArduinoJson @ 7.4.3
    h2zero/NimBLE-Arduino @ 1.4.1
    esphome/ESP32-audioI2S @ 2.1.0
    https://github.com/tzapu/WiFiManager.git
    jgromes/RadioLib @ ^6.4.0

; Shared build flags — common to all S3 devices.
; Keep PSRAM-specific switches out of this base block: Cardputer ADV is
; ESP32-S3FN8 / 8MB flash with no PSRAM, and paying PSRAM compile flags
; there obscures the real internal-DRAM budget.
build_flags_common =
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -fPIC
    -Os
    -DPISCES_ELF_API_MAJOR=1
    -DPISCES_ELF_API_MINOR=0
    -DPISCES_OS_VERSION=\"1.2.1\"

; PSRAM-only switches. Include this block only on boards that physically
; have PSRAM (T-Deck Plus, T-LoRa Pager, C28P).
build_flags_psram =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -mfix-esp32-psram-cache-issue

; PSRAM switches for RISC-V boards (C5). Same intent as build_flags_psram
; above, MINUS the -mfix-esp32-psram-cache-issue erratum flag — that flag
; works around a silicon bug specific to the original ESP32 (Xtensa) and
; is accepted-but-ignored on ESP32-S3. The RISC-V toolchain that ships
; with the C5 has no concept of it and rejects it outright. The C5 (RISC-V
; LX7? — actually a HP core + LP core) doesn't have the erratum to begin
; with, so we just drop the flag.
build_flags_psram_riscv =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1


; ── T-DECK PLUS ──────────────────────────────────────────
; Exact match to current working platformio.ini
; Only addition: -DDEVICE_TDECK_PLUS for HAL selection
[env:tdeck_plus]
extends = common

lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino @ 1.4.7
    ricmoo/QRCode @ ^0.0.1
    bitbank2/PNGdec @ ^1.0.1

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; macOS CDC upload fix — no DTR/RTS toggle on native USB
upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

; PSRAM memory type for T-Deck Plus hardware
board_build.arduino.memory_type = qio_opi

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram}
    -DDEVICE_TDECK_PLUS
    ; ─── I2S audio pins ───
    ; T-Deck Plus is the only device with TWO I2S buses:
    ;   I2S_NUM_0 (output)  → MAX98357A class-D amp → speaker
    ;   I2S_NUM_1 (input)   → ES7210 4-mic array codec
    ; The output bus has no MCLK pin (the amp doesn't need one and the
    ; ESP32-S3 generates BCLK internally). The input bus requires MCLK
    ; because the ES7210 needs the codec clock on a dedicated wire.
    ; v1.3 standardizes the naming with explicit OUT_/IN_ prefixes
    ; — see hal_pins.h for the cross-device convention.
    -DPIN_I2S_OUT_SCLK=7    ; output bit clock ("BCLK" / "SCK")
    -DPIN_I2S_OUT_LRCK=5    ; output word select ("LRC" / "WS")
    -DPIN_I2S_OUT_DOUT=6    ; output data line to amp
    -DPIN_I2S_IN_MCLK=48    ; input master clock to ES7210
    -DPIN_I2S_IN_SCLK=47    ; input bit clock ("SCK" in ES7210 docs)
    -DPIN_I2S_IN_LRCK=21    ; input word select
    -DPIN_I2S_IN_DIN=14     ; input data line from ES7210


; ── T-LORA PAGER ─────────────────────────────────────────
; Source: T-LoraPager V1.0 SCH 25-06-13.pdf
;         LilyGoLib official wiki hardware reference
;         LilyGoLib-PlatformIO/platformio.ini (canonical config)
; No LilyGoLib dependency — direct hardware access
[env:tlorapager]
extends = common

; ⚠ PLATFORM OVERRIDE — T-LoraPager only.
;   T-Deck Plus is on espressif32@6.7.0 (Arduino-ESP32 2.0.16) and works
;   fine. T-LoraPager's SPI stack has SD-mount issues on 2.0.16 that are
;   fixed in 2.0.17 (LilyGo's known-working version). We pin to 6.10.0
;   ONLY for this env to inherit those fixes without disturbing T-Deck.
platform = espressif32 @ 6.10.0

lib_deps =
    ${common.lib_deps}
    ricmoo/QRCode @ ^0.0.1
    bitbank2/PNGdec @ ^1.0.1

monitor_speed   = 921600
monitor_filters = esp32_exception_decoder, time

; ⚠ ARDUINO VARIANT — Pisces Moon ships LilyGo's exact variant header in
;   variants/lilygo_tlora_pager/ and includes it via -I in build_flags below.
;   We do NOT use board_build.arduino.variant — that mechanism requires the
;   variant to exist in the Arduino-ESP32 core, which it doesn't until
;   core v3.3.0. We are on espressif32@6.7.0 which bundles core 2.0.16.
;   The -I approach matches LilyGo's official platformio.ini exactly.
;
; ⚠ HARDWARE NOTE: T-LoraPager routes SPI on GPIO 33/34/35, which overlap
;   the ESP32-S3 Octal PSRAM pin range. qio_qspi puts PSRAM on the Quad
;   bus, freeing 33/34/35 for SPI use. (T-Deck Plus stays on qio_opi
;   because its SPI uses 38/40/41 — outside the OPI range.)
board_build.arduino.memory_type = qio_qspi

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram}
    -DDEVICE_TLORAPAGER
    -DARDUINO_T_LORA_PAGER       ; matches LilyGo's identifier — required by
                                 ; LilyGoLib.h's board-detection guards even
                                 ; though we don't use LilyGoLib itself
    -I variants/lilygo_tlora_pager  ; pins_arduino.h with correct SS/MOSI/MISO/SCK
    ; Pin assignments — confirmed from schematic + wiki
    -DPIN_SPI_MOSI=34
    -DPIN_SPI_MISO=33
    -DPIN_SPI_SCK=35
    -DPIN_LCD_CS=38
    -DPIN_LCD_DC=37
    -DPIN_LCD_BL=42
    -DPIN_KB_BL=46
    -DPIN_LORA_CS=36
    -DPIN_LORA_IRQ=14
    -DPIN_LORA_RST=47
    -DPIN_LORA_BUSY=48
    -DPIN_SD_CS=21
    -DPIN_NFC_CS=39
    -DPIN_NFC_IRQ=5
    -DPIN_GPS_TX=4
    -DPIN_GPS_RX=12
    -DPIN_GPS_PPS=13
    -DPIN_I2C_SDA=3
    -DPIN_I2C_SCL=2
    -DPIN_RTC_INT=1
    -DPIN_ENCODER_A=40
    -DPIN_ENCODER_B=41
    -DPIN_ENCODER_BTN=7
    -DPIN_KEY_INT=6
    -DPIN_IMU_HIRQ=8
    -DPIN_I2S_MCLK=10
    -DPIN_I2S_SCLK=11
    -DPIN_I2S_DOUT=45
    -DPIN_I2S_DIN=17
    -DPIN_I2S_LRCK=18
    -DPIN_NRF24_CE=43
    -DPIN_NRF24_CS=44
    -DPIN_BOOT_BTN=0


; ── CARDPUTER ADV ─────────────────────────────────────────
; Source: docs.m5stack.com/en/core/Cardputer-Adv (PinMap section)
;         docs.m5stack.com/en/cap/Cap_LoRa868 (header pinout)
[env:cardputer_adv]
extends = common

; Cardputer ADV target is ESP32-S3FN8 class: 8MB flash, no PSRAM.
board_upload.flash_size   = 8MB
board_upload.maximum_size = 8388608
board_build.partitions    = partitions_cardputer.csv

lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino @ 1.4.7
    ; M5Cardputer keyboard driver — wraps TCA8418 matrix scan
    ; and provides Fn-modifier resolution. v1.1.1 specifically:
    ; 1.1.0 has a known bug where z/c/b/m return lowercase even
    ; when shift is held. M5Unified is M5Cardputer's transitive
    ; dependency but pinning it here documents the requirement.
    m5stack/M5Cardputer @ ^1.1.1
    m5stack/M5Unified @ ^0.2.8
    ricmoo/QRCode @ ^0.0.1
    bitbank2/PNGdec @ ^1.0.1

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

build_flags =
    ${common.build_flags_common}
    ; Preserve DWARF symbols in firmware.elf for esp32_exception_decoder.
    ; This does not get flashed, and keeps the field-capture build release-like.
    -g3
    -DDEVICE_CARDPUTER_ADV
    -DDEVICE_NO_PSRAM
    -DARDUINO_M5STACK_CARDPUTER_ADV
    -I variants/m5stack_cardputer_adv
    ; ─────────────────────────────────────────────────────
    ;  HISTORICAL NOTE — CONFIG_* SDK flags removed in v1.2
    ;
    ;  Earlier v1.2 development attempted to inject ESP-IDF sdkconfig
    ;  overrides (CONFIG_BT_NIMBLE_*, CONFIG_ESP_WIFI_*, CONFIG_SW_
    ;  COEXIST_ENABLE) via -D build_flags here to shrink NimBLE and
    ;  tune WiFi for the no-PSRAM Cardputer.
    ;
    ;  This DOES NOT WORK with Arduino-ESP32. The framework links
    ;  against pre-compiled libraries (libbt.a, libwifi.a) built with
    ;  the sdkconfig defaults baked in at library compile time. The
    ;  -D flags only reach project-built libraries (like NimBLE-
    ;  Arduino, which gets compiled fresh in .pio/libdeps/).
    ;
    ;  Result: NimBLE-Arduino was being compiled with reduced buffer
    ;  counts, but the underlying ESP-IDF Bluetooth controller was
    ;  still expecting defaults. The mismatch caused NimBLEDevice::
    ;  init() to hang indefinitely waiting for buffer pools the
    ;  controller wouldn't provide, triggering the task watchdog at
    ;  5 seconds.
    ;
    ;  Tuning NimBLE on Cardputer requires a real sdkconfig override
    ;  (custom ESP-IDF build or sdkconfig.defaults via a recent
    ;  Arduino-ESP32 framework version). Both are larger changes than
    ;  v1.2 can absorb. v1.3 may revisit.
    ;
    ;  For now, the no-PSRAM constraint is handled architecturally
    ;  instead: WiFi mode-locking (g_wifi_mode in wifi_mode.cpp)
    ;  enforces wardrive vs WiFi-client as mutually exclusive, and
    ;  lazy boot init (no autoconnect, no Gemini at startup) recovers
    ;  ~30-50KB of headroom for whichever mode the user selects.
    ; ─────────────────────────────────────────────────────
    ; Display pins (ST7789V2 240x135, landscape)
    -DPIN_LCD_BL=38
    -DPIN_LCD_RST=33
    -DPIN_LCD_DC=34
    -DPIN_LCD_MOSI=35
    -DPIN_LCD_SCK=36
    -DPIN_LCD_CS=37
    ; Shared SPI bus (SD + LoRa cap)
    -DPIN_SPI_MOSI=14
    -DPIN_SPI_MISO=39
    -DPIN_SPI_SCK=40
    -DPIN_SD_CS=12
    ; LoRa cap
    -DPIN_LORA_CS=5
    -DPIN_LORA_RST=3
    -DPIN_LORA_IRQ=4
    -DPIN_LORA_BUSY=6
    ; GPS UART
    -DPIN_GPS_TX=13
    -DPIN_GPS_RX=15
    ; I2C bus (codec + IMU + keyboard)
    -DPIN_I2C_SDA=8
    -DPIN_I2C_SCL=9
    -DPIN_KEY_INT=11
    ; P4 tether on the Grove/custom port. Default bridge is UART so high-volume
    ; GPS/keyboard/LoRa/promiscuous WiFi events do not bottleneck on I2C.
    ; M5 custom port order is GND/5V/G2/G1; use G2 as TX-to-P4 and G1 as RX-from-P4.
    -DPM_P4_TETHER_UART=1
    -DPIN_P4_UART_RX=1
    -DPIN_P4_UART_TX=2
    ; Retained for the parked I2C responder path if PM_P4_TETHER_UART is disabled.
    -DPIN_P4_I2C_SDA=2
    -DPIN_P4_I2C_SCL=1
    ; ES8311 I2S audio
    -DPIN_I2S_SCLK=41
    -DPIN_I2S_DOUT=46
    -DPIN_I2S_LRCK=43
    -DPIN_I2S_DIN=42
    ; IR + battery + boot
    -DPIN_IR_TX=44
    -DPIN_BAT_ADC=10
    -DPIN_BOOT_BTN=0


; ── C28P (LCDwiki 2.8" ESP32-S3 Display) ─────────────────
; Source: lcdwiki.com/2.8inch_ESP32-S3_Display (C28P variant)
;
; Form factor: desk-fixture / kiosk
; Display:     ILI9341V 240x320 IPS, native portrait, 4-wire SPI
; Touch:       FT6336G capacitive (I2C shared bus)
; Audio:       ES8311 codec + MEMS mic + audio amp (I2S)
; Storage:     MicroSD via SDIO (4-bit)
; Memory:      ESP32-S3R8 — 8MB octal PSRAM, 16MB flash
; Radios:      WiFi + BLE only — no LoRa, no GPS, no NFC
; Input:       Touchscreen only — no keyboard, no buttons
; Power:       USB-C (no battery — desk fixture)
;
; Pisces Moon focus on C28P: audio I/O + AI voice + kiosk apps
; (weather, RSS, ambient display, screensaver). Apps requiring
; LoRa, GPS, keyboard, or trackball are hidden via the capability
; descriptor.
;
; NOTE — INTERNAL DEVELOPMENT: Pinout below is based on LCDwiki
; published documentation. ANY pin may need adjustment after first
; bring-up. Treat this block as a starting hypothesis, not a
; verified configuration.
[env:c28p]
extends = common

lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino @ 1.4.7

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Native USB CDC — same reset method as T-Deck Plus and Cardputer
upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

; ESP32-S3R8 has octal PSRAM, same as T-Deck Plus.
board_build.arduino.memory_type = qio_opi

; ─── BUILD SOURCE FILTER — C28P first-boot bring-up ───
; The C28P codebase is starting from minimal scaffolding. Most of
; Pisces Moon's apps (radios, GPS, keyboard-driven UI, T-Deck-shaped
; launcher) are not yet C28P-aware and would fail to compile if
; included. This filter restricts the build to the universal core
; plus the C28P bring-up file. As C28P-aware apps are written, they
; get added to this filter — explicit opt-in, not blanket inclusion.
;
; Header-only universal files (HAL, theme, time, capability
; descriptor) are picked up via #include and don't need to be
; in this list.
build_src_filter =
    -<*>
    +<main.cpp>
    +<c28p_boot.cpp>
    +<c28p_dpad.cpp>
    +<c28p_audio.cpp>
    +<c28p_apps.cpp>
    +<kiosk_wifi_setup.cpp>
    +<c28p_audio_app.cpp>
    +<c28p_ai.cpp>
    +<weather.cpp>
    +<rss.cpp>
    +<voice_terminal.cpp>
    +<c28p_media.cpp>
    +<c28p_system.cpp>
    +<c28p_wardrive.cpp>
    +<c28p_data_reader.cpp>
    +<c28p_anomaly.cpp>
    +<c28p_mic_probe.cpp>
    +<tetris.cpp>
    +<snake.cpp>
    +<pacman.cpp>
    +<galaga.cpp>
    +<pole_position.cpp>
    +<mario_bros.cpp>
    +<donkey_kong.cpp>
    +<breakout.cpp>
    +<game_2048.cpp>
    +<minesweeper.cpp>
    +<connect4.cpp>
    +<simon.cpp>
    +<solitaire.cpp>
    +<asteroids.cpp>
    +<space_invaders.cpp>
    +<frogger.cpp>
    +<chess.cpp>
    +<ereader.cpp>
    +<game_input.cpp>
    +<game_audio.cpp>
    +<filesystem.cpp>
    +<wifi_manager.cpp>
    +<text_buffer.cpp>
    +<wifi_mode.cpp>
    +<wifi_filemgr.cpp>
    +<gemini_client.cpp>
    +<nosql_store.cpp>
    +<pm_storage.cpp>
    +<c28p_wardrive_engine.cpp>
    +<database.cpp>
    +<time_service.cpp>
    +<pm_text_input.cpp>
    +<pm_calculator.cpp>
    +<pm_units.cpp>
    +<pm_clock.cpp>
    +<pm_tracker_scan.cpp>
    +<pm_rss_cache.cpp>
    +<pm_notes.cpp>
    +<pm_contacts.cpp>
    +<pm_calendar.cpp>

build_flags =
    ${common.build_flags_common}
    ${common.build_flags_psram}
    -DDEVICE_C28P
    -DARDUINO_LCDWIKI_C28P
    ; ─── Display pins (ILI9341V on SPI, 240x320 native portrait) ───
    ; Authoritative source: LCDwiki ESP32-S3 I/O resource allocation
    ; table for ES3C28P / ES3N28P. Confirmed against board silkscreen
    ; for I2C pins (IO16=SDA, IO15=SCL).
    ; lcdwiki.com/2.8inch_ESP32-S3_Display
    -DPIN_LCD_MOSI=11
    -DPIN_LCD_MISO=13
    -DPIN_LCD_SCK=12
    -DPIN_LCD_CS=10
    -DPIN_LCD_DC=46
    -DPIN_LCD_RST=-1       ; LCD shares reset with ESP32-S3 EN pin (no separate GPIO)
    -DPIN_LCD_BL=45
    ; ─── Touch (FT6336G, capacitive, I2C) ───
    ; Touch IC shares the main I2C bus with the audio codec.
    -DPIN_TOUCH_INT=17
    -DPIN_TOUCH_RST=18
    ; ─── I2C bus (touch + audio codec) ───
    ; Confirmed from board silkscreen at the I2C connector:
    ;   IO16 (SDA), IO15 (SCL)
    ; Touch FT6336G FFC also routes SDA/INT/RST through this connector.
    -DPIN_I2C_SDA=16
    -DPIN_I2C_SCL=15
    ; ─── I2S audio (ES8311 codec + FM8002E amp + MEMS mic) ───
    ; IO1 enables the FM8002E audio amplifier (low=enabled).
    ; ES8311 is on I2C @ 0x18 (shared bus, scanned at boot).
    -DPIN_AUDIO_EN=1
    -DPIN_I2S_MCLK=4
    -DPIN_I2S_SCLK=5
    -DPIN_I2S_DOUT=8
    -DPIN_I2S_LRCK=7
    -DPIN_I2S_DIN=6
    ; ─── MicroSD (SDIO 4-bit mode, separate from SPI bus) ───
    ; SDIO bus — CLK/CMD plus four data lines.
    -DPIN_SD_CLK=38
    -DPIN_SD_CMD=40
    -DPIN_SD_D0=39
    -DPIN_SD_D1=41
    -DPIN_SD_D2=48
    -DPIN_SD_D3=47
    ; ─── Misc ───
    -DPIN_RGB_LED=42       ; WS2812B-V5-W single status LED
    -DPIN_BAT_ADC=9        ; battery voltage sense
    -DPIN_BOOT_BTN=0
    ; ─── Capability flags (consumed by capability descriptor) ───
    -DPM_FORM_FACTOR_KIOSK
    -DPM_HAS_AUDIO_IN
    -DPM_HAS_AUDIO_OUT
    -DPM_HAS_TOUCH
    -DPM_HAS_BATTERY       ; 3.7V LiPo via 1.25mm 2P JST, TP4054 charge IC
    -DPM_NO_KEYBOARD
    -DPM_NO_LORA
    -DPM_NO_GPS


; ── MAXINE (Sunton ESP32-8048S050C 5" 800x480) ───────────
; Source: Sunton/Guition ESP32-8048 family references
;         (Arduino_GFX Arduino_ESP32RGBPanel + TAMC_GT911
;         community configs). github.com/mr-sven/esp32-8048S050C
;
; Form factor: large-format desk/wall kiosk
; Display:     ST7262 800x480 IPS, PARALLEL RGB interface (NOT SPI),
;              operated in PORTRAIT (480x800 logical) to match the
;              C28P interaction model.
; Touch:       GT911 capacitive (I2C) — TAMC_GT911 driver (already
;              in common lib_deps).
; Audio:       output only — NO built-in microphone on this board.
; Memory:      ESP32-S3 w/ octal PSRAM (framebuffer MUST live in
;              PSRAM — 800x480x2 = 768KB won't fit internal RAM).
; Radios:      WiFi + BLE only.
; Input:       Touchscreen only — no keyboard, no buttons.
;
; Software class is identical to the C28P (touch-only kiosk); Maxine
; runs its own maxine_boot.cpp / maxine_dpad.cpp, modeled on the C28P
; files but scaled to 480x800 off SCREEN_W/SCREEN_H.
;
; ⚠ INTERNAL DEVELOPMENT — RGB DATA/SYNC PINS AND TOUCH PINS BELOW
;   ARE AN UNVERIFIED STARTING HYPOTHESIS from 8048-family community
;   configs. The RGB pin map VARIES between 8048 board variants.
;   CONFIRM EVERY PIN AGAINST YOUR BOARD AT FIRST BRING-UP. These
;   pins are consumed only by the RGB panel + GT911 setup in
;   main.cpp; the launcher/dpad/games are pin-agnostic.
[env:maxine]
extends = common

lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino @ 1.4.7

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_resetmethod = no_reset
upload_flags =
    --before=default_reset
    --after=hard_reset

; Octal PSRAM — required for the 800x480 RGB framebuffer.
board_build.arduino.memory_type = qio_opi

; ─── BUILD SOURCE FILTER — Maxine first-boot bring-up ───
; Minimal set: universal core + Maxine bring-up files + the games
; that have a Maxine/kiosk render path. C28P app files (audio, AI,
; weather, wardrive, media, mic-probe) are NOT included — they are
; not yet Maxine-aware and several pull in recording/mic code that
; this board has no hardware for. Add files here as they gain a
; Maxine path — explicit opt-in, never blanket inclusion.
build_src_filter =
    -<*>
    +<main.cpp>
    +<maxine_boot.cpp>
    +<maxine_dpad.cpp>
    +<maxine_apps.cpp>
